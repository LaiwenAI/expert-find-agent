[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expert-find-agent"
version = "0.1.0"
description = "Evidence-grounded expert search with tree navigation and reproducible baselines"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["laiwenai==0.0.12", "openpyxl>=3.1,<4", "numpy>=1.26,<3", "tiktoken==0.12.0"]

[project.optional-dependencies]
ann = ["faiss-cpu==1.16.0"]
local = ["fastembed==0.9.1"]
rerank = ["flashrank==0.2.10"]
mlx = ["mlx-lm==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'", "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'", "transformers==5.23.0; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.setuptools.packages.find]
where = ["src"]
