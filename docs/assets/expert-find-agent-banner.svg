<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Expert Find Agent</title>
  <desc id="description">Evidence-based expert search connecting publications and profiles to traceable expert recommendations.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#101b32"/><stop offset="1" stop-color="#07101d"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#28b9cd" stop-opacity=".18"/><stop offset="1" stop-color="#28b9cd" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8eacc8" opacity=".15"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#background)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <circle cx="1000" cy="150" r="250" fill="url(#glow)"/>
  <g font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="52" y="34" width="184" height="27" rx="13.5" fill="#183b49"/>
    <text x="144" y="52" text-anchor="middle" fill="#7de1dc" font-size="11" font-weight="700" letter-spacing="1.3">RESEARCH PROTOTYPE</text>
    <text x="52" y="122" fill="#f1f6ff" font-size="46" font-weight="750" letter-spacing="-1.1">Evidence-Based</text>
    <text x="52" y="178" fill="#f1f6ff" font-size="46" font-weight="750" letter-spacing="-1.1">Expert Search</text>
    <text x="55" y="220" fill="#a9bdd3" font-size="16">Traceable sources. Scoped reasoning. Reproducible research.</text>
    <path d="M925 95 C966 95 962 150 994 150 M925 205 C966 205 962 150 994 150 M1054 150 H1080" fill="none" stroke="#51c5cc" stroke-width="2"/>
    <g fill="#10263a" stroke="#36546b" stroke-width="1.2">
      <rect x="748" y="59" width="177" height="72" rx="10"/>
      <rect x="748" y="169" width="177" height="72" rx="10"/>
      <rect x="1080" y="108" width="90" height="84" rx="12"/>
    </g>
    <g fill="#d8e8f4" font-size="11" font-weight="650" letter-spacing="1.2">
      <text x="767" y="83">PUBLICATIONS</text><text x="767" y="194">PROFILES</text>
      <text x="1125" y="177" text-anchor="middle" font-size="10">EXPERTS</text>
    </g>
    <g stroke="#638699" stroke-width="3" stroke-linecap="round"><path d="M768 99 H902 M768 112 H863 M768 211 H902 M768 224 H878"/></g>
    <circle cx="1024" cy="150" r="30" fill="#123c49" stroke="#65dfd4" stroke-width="1.6"/>
    <g fill="none" stroke="#8ae9de" stroke-width="2.4" stroke-linecap="round"><circle cx="1020" cy="146" r="9"/><path d="m1027 153 8 8"/></g>
    <circle cx="1125" cy="134" r="9" fill="#7adfd4"/><path d="M1109 158 Q1109 145 1125 145 Q1141 145 1141 158" fill="none" stroke="#7adfd4" stroke-width="3" stroke-linecap="round"/>
    <path d="M54 259 H1146" stroke="#30445c" stroke-width="1"/>
    <text x="55" y="281" fill="#7e98b3" font-size="10" letter-spacing="1.5">EXPERT-FIND-AGENT</text>
    <text x="1146" y="281" text-anchor="end" fill="#7e98b3" font-size="10" letter-spacing="1.3">SOURCES / RETRIEVAL / EVIDENCE</text>
  </g>
